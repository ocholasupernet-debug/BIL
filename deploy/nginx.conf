##############################################################
# OcholaSupernet — wildcard nginx reverse proxy for isplatty.org
#
# The wildcard A record is managed at Namecheap. This file only
# controls routing after DNS has already resolved to the VPS.
##############################################################

# Keep the public marketing hostname canonical.
server {
    listen 80;
    listen [::]:80;
    server_name www.isplatty.org;
    return 301 https://isplatty.org$request_uri;
}

# HTTP is only a redirect layer. The wildcard covers newly-created tenant
# hostnames without requiring another server block or DNS record, while the
# ACME location lets the tenant synchronizer renew host-specific certificates.
server {
    listen 80;
    listen [::]:80;
    server_name isplatty.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.isplatty.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# One application entry point for the apex and every first-level tenant
# hostname. The certificate must contain both isplatty.org and
# *.isplatty.org; deploy/configure-nginx.sh verifies that before reload.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isplatty.org *.isplatty.org;

    ssl_certificate     /etc/letsencrypt/live/isplatty.org-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty.org-wildcard/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # $http_host preserves the caller's Host value, including a port
        # when one was supplied. The API uses it to resolve the tenant.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

# Active tenant certificates are exact-name vhosts. They take precedence over
# the wildcard server above, and are generated by sync-tenant-certificates.sh.
include /etc/nginx/tenant-sites.d/*.conf;