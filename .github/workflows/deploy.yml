name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reconcile_reseller_port:
        description: "Optional active VLAN reseller port ID to reconcile on its MikroTik"
        required: false
        type: string

concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build release artifacts on the runner
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          BASE_PATH="/" pnpm --filter @workspace/ochola-supernet run build:vps
          pnpm --filter @workspace/api-server run build
          test -s artifacts/ochola-supernet/dist/public/index.html
          test -s artifacts/api-server/dist/index.mjs

      - name: Package release for VPS
        run: |
          release_archive="${RUNNER_TEMP}/ocholasupernet-release.tgz"
          tar \
            --exclude='./.git' \
            --exclude='./.local' \
            --exclude='./.cache' \
            --exclude='./.agents' \
            --exclude='./screenshots' \
            --exclude='./attached_assets' \
            --exclude='./.env' \
            --exclude='*/.env' \
            --exclude='./node_modules' \
            --exclude='*/node_modules' \
            --exclude='./artifacts/ocholasupernet-mobile' \
            --exclude='./artifacts/mockup-sandbox' \
            --exclude='./artifacts/ocholasupernet-mobile/dist' \
            --exclude='./artifacts/mockup-sandbox/dist' \
            --exclude='./logs' \
            --exclude='*/logs' \
            --exclude='*.log' \
            -czf "$release_archive" .
          mv "$release_archive" ocholasupernet-release.tgz

      - name: Encode runtime SSH material
        id: encode_runtime_ssh
        shell: bash
        env:
          DEPLOY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          printf 'VPS_SSH_KEY_B64=%s\n' \
            "$(printf '%s' "$DEPLOY_VPS_SSH_KEY" | base64 -w0)" >> "$GITHUB_OUTPUT"
          printf 'VPS_SSH_PASSPHRASE_B64=%s\n' \
            "$(printf '%s' "$DEPLOY_VPS_SSH_PASSPHRASE" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Copy release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          source: ocholasupernet-release.tgz
          target: /tmp
          overwrite: true
          timeout: 120s
          command_timeout: 15m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          envs: VITE_SUPABASE_URL,VITE_SUPABASE_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_DB_URL,SESSION_SECRET,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ZONE_ID,VPS_USER,VPS_SSH_KEY_B64,VPS_SSH_PASSPHRASE_B64
          script: |
            set -e
            echo "=== Starting deploy at $(date) ==="
            cd /var/www/ocholasupernet

            # The GitHub runner has already checked out the exact release. The
            # VPS no longer needs to fetch GitHub over its unreliable outbound
            # connection, which previously failed with a broken pipe.
            test -s /tmp/ocholasupernet-release.tgz
            tar -xzf /tmp/ocholasupernet-release.tgz -C .
            rm -f /tmp/ocholasupernet-release.tgz

            # Inject Supabase credentials and the encryption key into .env so PM2 always has them
            # (safe even if already set — idempotent upsert)
            upsert_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return
              grep -q "^${key}=" .env 2>/dev/null \
                && sed -i "s|^${key}=.*|${key}=${val}|" .env \
                || echo "${key}=${val}" >> .env
              echo "  ✓ ${key} written to .env"
            }

            touch .env
            upsert_env "VITE_SUPABASE_URL"        "$VITE_SUPABASE_URL"
            upsert_env "VITE_SUPABASE_KEY"         "$VITE_SUPABASE_KEY"
            upsert_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            upsert_env "SUPABASE_DB_URL"           "$SUPABASE_DB_URL"
            upsert_env "SESSION_SECRET"             "$SESSION_SECRET"
            # Dedicated router-management VPN endpoint. Keep this separate
            # from any stale VPS_HOST value used by older deployments.
            upsert_env "ROUTER_OPENVPN_ENDPOINT"  "vpn.isplatty.org"
            # The deployment key used by this workflow is authorized for root
            # on the VPS. The API's SSH reconciliation helper must use the
            # same authenticated principal; a separate admin user is not
            # authorized by this deployment key.
            upsert_env "VPS_HOST"                 "vpn.isplatty.org"
            upsert_env "VPS_USER"                 "root"
            # Store multiline SSH material as base64: so .env remains valid.
            # The API decodes it only in memory when opening the SSH channel.
            if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
              upsert_env "VPS_SSH_KEY" "base64:${VPS_SSH_KEY_B64}"
            elif [ -n "${VPS_SSH_KEY:-}" ]; then
              upsert_env "VPS_SSH_KEY" "base64:$(printf '%s' "$VPS_SSH_KEY" | base64 -w0)"
            fi
            if [ -n "${VPS_SSH_PASSPHRASE_B64:-}" ]; then
              upsert_env "VPS_SSH_PASSPHRASE_B64" "base64:${VPS_SSH_PASSPHRASE_B64}"
            elif [ -n "${VPS_SSH_PASSPHRASE:-}" ]; then
              upsert_env "VPS_SSH_PASSPHRASE_B64" "base64:$(printf '%s' "$VPS_SSH_PASSPHRASE" | base64 -w0)"
            fi

            # The workflow connects as root. Running sudo here adds an
            # unnecessary dependency and can fail before the application
            # deployment starts on minimal VPS images.
            bash deploy/configure-nginx.sh

            # This release changes application source only; package manifests
            # and the lockfile are unchanged, so avoid a fragile registry
            # install on the VPS. deploy.sh still fails explicitly if the
            # required workspace binaries are absent.
            DEPLOY_FROM_ARCHIVE=1 \
            DEPLOY_SKIP_INSTALL=1 \
            DEPLOY_SKIP_BUILD=1 \
            DEPLOY_SOURCE_COMMIT="${{ github.sha }}" \
              bash deploy/deploy.sh
            api_ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/healthz >/dev/null; then
                api_ready=true
                break
              fi
              echo "API is still starting (attempt ${attempt}/30)..."
              sleep 2
            done
            if [ "$api_ready" != "true" ]; then
              echo "ERROR: API health check did not pass after 60 seconds."
              pm2 status || true
              pm2 logs ocholanet-api --lines 80 --nostream || true
              exit 1
            fi
            echo "=== API health check passed ==="
            if [ -n "${RECONCILE_RESELLER_PORT:-}" ]; then
              case "$RECONCILE_RESELLER_PORT" in
                ''|*[!0-9]*) echo "ERROR: reconcile_reseller_port must be a positive numeric port ID."; exit 1 ;;
              esac
              echo "=== Reconciling reseller port ${RECONCILE_RESELLER_PORT} on its MikroTik ==="
              RECONCILE_RESELLER_PORT="$RECONCILE_RESELLER_PORT" node --input-type=module <<'NODE'
              import crypto from "node:crypto";

              const portId = process.env.RECONCILE_RESELLER_PORT;
              const secret = process.env.SESSION_SECRET;
              if (!secret) throw new Error("SESSION_SECRET is not available for the one-time reconciliation.");
              const time = Math.floor(Date.now() / 1000);
              const payload = `a.3.${time}`;
              const signature = crypto.createHmac("sha256", secret).update(payload).digest("hex");
              const token = `${payload}.${signature}`;
              const response = await fetch(`http://127.0.0.1:8080/api/admin/reseller-handoffs/${portId}/push`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${token}`,
                  host: "come.isplatty.org",
                  "x-forwarded-proto": "https",
                  "content-type": "application/json",
                },
                body: "{}",
              });
              const body = await response.text();
              if (!response.ok) {
                throw new Error(`Reseller port reconciliation failed (${response.status}): ${body.slice(0, 500)}`);
              }
              let parsed;
              try {
                parsed = JSON.parse(body);
              } catch {
                parsed = { ok: true, response: body.slice(0, 500) };
              }
              console.log(JSON.stringify({
                ok: parsed.ok,
                portId: parsed.assignment?.id ?? Number(portId),
                status: parsed.assignment?.status ?? null,
                error: parsed.error ?? null,
              }));
              NODE
              echo "=== Reseller port reconciliation completed ==="
            fi
            echo "=== Deploy finished at $(date) ==="
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ steps.encode_runtime_ssh.outputs.VPS_SSH_KEY_B64 }}
          VPS_SSH_PASSPHRASE_B64: ${{ steps.encode_runtime_ssh.outputs.VPS_SSH_PASSPHRASE_B64 }}
          RECONCILE_RESELLER_PORT: ${{ inputs.reconcile_reseller_port }}
