name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Package release for VPS
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='*/.env' \
            --exclude='./node_modules' \
            --exclude='*/node_modules' \
            --exclude='./dist' \
            --exclude='*/dist' \
            --exclude='./logs' \
            --exclude='*/logs' \
            --exclude='*.log' \
            -czf ocholasupernet-release.tgz .

      - name: Copy release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          source: ocholasupernet-release.tgz
          target: /tmp
          overwrite: true
          timeout: 120s
          command_timeout: 15m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          envs: VITE_SUPABASE_URL,VITE_SUPABASE_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_DB_URL,SESSION_SECRET,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ZONE_ID
          script: |
            set -e
            echo "=== Starting deploy at $(date) ==="
            cd /var/www/ocholasupernet

            # The GitHub runner has already checked out the exact release. The
            # VPS no longer needs to fetch GitHub over its unreliable outbound
            # connection, which previously failed with a broken pipe.
            test -s /tmp/ocholasupernet-release.tgz
            tar -xzf /tmp/ocholasupernet-release.tgz -C .
            rm -f /tmp/ocholasupernet-release.tgz

            # Inject Supabase credentials and the encryption key into .env so PM2 always has them
            # (safe even if already set — idempotent upsert)
            upsert_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return
              grep -q "^${key}=" .env 2>/dev/null \
                && sed -i "s|^${key}=.*|${key}=${val}|" .env \
                || echo "${key}=${val}" >> .env
              echo "  ✓ ${key} written to .env"
            }

            touch .env
            upsert_env "VITE_SUPABASE_URL"        "$VITE_SUPABASE_URL"
            upsert_env "VITE_SUPABASE_KEY"         "$VITE_SUPABASE_KEY"
            upsert_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            upsert_env "SUPABASE_DB_URL"           "$SUPABASE_DB_URL"
            upsert_env "SESSION_SECRET"             "$SESSION_SECRET"

            sudo -E bash deploy/configure-nginx.sh

            DEPLOY_FROM_ARCHIVE=1 \
            DEPLOY_SOURCE_COMMIT="${{ github.sha }}" \
              bash deploy/deploy.sh
            echo "=== Deploy finished at $(date) ==="
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
