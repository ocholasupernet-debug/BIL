kind = "mobile"
previewPath = "/mobile/"
title = "OcholaSuperNet Mobile"
description = "A branded native admin app for ISP operators to manage customers, routers, billing, and network operations from Android and iPhone devices."
version = "1.0.0"
id = "artifacts/ocholasupernet-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20256

[services.development]
run = "pnpm --filter @workspace/ocholasupernet-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ocholasupernet-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ocholasupernet-mobile", "run", "serve" ]

[services.env]
PORT = "20256"
BASE_PATH = "/mobile/"
