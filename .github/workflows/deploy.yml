name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          envs: VITE_SUPABASE_URL,VITE_SUPABASE_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_DB_URL,SESSION_SECRET
          script: |
            set -e
            echo "=== Starting deploy at $(date) ==="
            cd /var/www/ocholasupernet

            # Load the deployment script from the pushed revision. A running
            # shell script cannot update its own already-loaded instructions.
            git fetch origin main
            git reset --hard origin/main

            # Inject Supabase credentials and the encryption key into .env so PM2 always has them
            # (safe even if already set — idempotent upsert)
            upsert_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return
              grep -q "^${key}=" .env 2>/dev/null \
                && sed -i "s|^${key}=.*|${key}=${val}|" .env \
                || echo "${key}=${val}" >> .env
              echo "  ✓ ${key} written to .env"
            }

            touch .env
            upsert_env "VITE_SUPABASE_URL"        "$VITE_SUPABASE_URL"
            upsert_env "VITE_SUPABASE_KEY"         "$VITE_SUPABASE_KEY"
            upsert_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            upsert_env "SUPABASE_DB_URL"           "$SUPABASE_DB_URL"
            upsert_env "SESSION_SECRET"             "$SESSION_SECRET"

            if [ -n "${NAMECHEAP_API_KEY:-}" ] && [ -n "${NAMECHEAP_API_USER:-}" ]; then
              export NAMECHEAP_API_USER NAMECHEAP_API_KEY NAMECHEAP_USERNAME NAMECHEAP_CLIENT_IP CERTBOT_EMAIL
              sudo -E bash deploy/configure-nginx.sh
            fi

            bash deploy/deploy.sh
            echo "=== Deploy finished at $(date) ==="
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_CLIENT_IP: 102.203.116.204
          CERTBOT_EMAIL: admin@isplatty.org
