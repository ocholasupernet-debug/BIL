# Proposed STATIC-ONLY corporate TLS routing.
# Do not add another port-80 server: the existing default vhost already handles
# HTTP redirects and ACME challenges for these names from /var/www/letsencrypt.
# Replace the existing exact .org TLS vhost only after the new certificate and
# static files are ready. Do not add a wildcard .org vhost.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/isplatty-org/static-site;
    index index.html;
    location = /admin.html { return 404; }
    location ^~ /org-admin-api { return 404; }
    location ^~ /org-api { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    return 301 https://isplatty.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chrisphine3.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    return 404;
}
