name: Cloudflare R2 credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2_preflight:
    name: Read-only R2 bucket access check
    runs-on: ubuntu-latest
    steps:
      - name: Check out preflight code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install the isolated preflight dependency
        run: pnpm install --filter @workspace/api-server... --frozen-lockfile

      - name: Test R2 preflight behavior
        run: node --test artifacts/api-server/tests/r2-credential-preflight.test.mjs

      - name: Verify R2 credentials and bucket access
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET_BIL: ${{ secrets.CLOUDFLARE_R2_BUCKET_BIL }}
          CLOUDFLARE_R2_BUCKET_ISPLATTY: ${{ secrets.CLOUDFLARE_R2_BUCKET_ISPLATTY }}
        run: pnpm --filter @workspace/api-server exec node scripts/r2-credential-preflight.mjs
