name: Sync Super Admin credentials to VPS

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: superadmin-credential-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync only Super Admin credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate required secrets without printing values
        shell: bash
        env:
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_API_KEY: ${{ secrets.SUPERADMIN_API_KEY }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPERADMIN_USERNAME SUPERADMIN_API_KEY SUPERADMIN_PASSWORD; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "::error::$name is not configured in GitHub Actions Secrets."
              exit 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::$name must be a single-line value."
              exit 1
            fi
            if [[ "$name" != "SUPERADMIN_PASSWORD" && "$value" != "${value#"${value%%[![:space:]]*}"}" ]]; then
              echo "::error::$name must not have surrounding whitespace."
              exit 1
            fi
            if [[ "$name" != "SUPERADMIN_PASSWORD" && "$value" != "${value%"${value##*[![:space:]]}"}" ]]; then
              echo "::error::$name must not have surrounding whitespace."
              exit 1
            fi
            printf '%s: present\n' "$name"
          done

      - name: Update only Super Admin credentials and reload API
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 102.203.116.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: "SHA256:XlSA4l6O/lK6axMYwcViSVdoy2Z8i3DPDjJtQtQrtFc"
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SUPERADMIN_USERNAME,SUPERADMIN_API_KEY,SUPERADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /var/www/ocholasupernet

            for name in SUPERADMIN_USERNAME SUPERADMIN_API_KEY SUPERADMIN_PASSWORD; do
              value="${!name:-}"
              if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                echo "ERROR: required Super Admin configuration is missing or invalid."
                exit 1
              fi
            done
            if [[ ! -f .env ]]; then
              echo "ERROR: expected VPS .env file is missing; refusing to create a partial environment."
              exit 1
            fi
            if ! pm2 describe ocholanet-api >/dev/null 2>&1; then
              echo "ERROR: expected PM2 API process is not running; refusing to change the environment."
              exit 1
            fi

            node <<'NODE'
            const config = require("./ecosystem.config.cjs");
            const app = config.apps.find((entry) => entry.name === "ocholanet-api");
            const env = app?.env_standalone;
            for (const name of [
              "SUPERADMIN_USERNAME",
              "SUPERADMIN_API_KEY",
              "SUPERADMIN_PASSWORD",
            ]) {
              if (typeof env?.[name] !== "string" || !env[name]) {
                throw new Error("A Super Admin variable is not mapped to the PM2 API environment.");
              }
              console.log(`${name}: ready for PM2`);
            }
            NODE

            env_backup="$(mktemp /tmp/ocholanet-env.XXXXXX)"
            cp -- .env "$env_backup"
            chmod 600 "$env_backup"
            restore_previous_env() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                if cp -- "$env_backup" .env && chmod 600 .env; then
                  if pm2 reload ecosystem.config.cjs --env standalone --update-env >/dev/null 2>&1; then
                    echo "Credential sync failed; previous environment was restored."
                  else
                    echo "ERROR: previous environment was restored, but PM2 recovery needs inspection."
                  fi
                else
                  echo "ERROR: credential sync failed and the previous environment could not be restored."
                fi
              fi
              rm -f -- "$env_backup"
              exit "$status"
            }
            trap restore_previous_env EXIT

            node <<'NODE'
            const crypto = require("node:crypto");
            const fs = require("node:fs");

            const names = [
              "SUPERADMIN_USERNAME",
              "SUPERADMIN_API_KEY",
              "SUPERADMIN_PASSWORD",
            ];
            const values = Object.fromEntries(names.map((name) => {
              const value = process.env[name];
              if (!value || /[\r\n\u0000-\u001f\u007f]/.test(value)) {
                throw new Error("A required Super Admin value is missing or not single-line.");
              }
              return [name, value];
            }));

            const original = fs.readFileSync(".env", "utf8");
            const lines = original.split(/\r?\n/);
            if (original.endsWith("\n")) lines.pop();
            const managed = new Set(names);
            const retained = lines.filter((line) => {
              const match = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=/);
              return !match || !managed.has(match[1]);
            });
            const updated = [
              ...retained,
              ...names.map((name) => `${name}=${JSON.stringify(values[name])}`),
            ].join("\n") + "\n";
            const tempPath = `.env.superadmin-${process.pid}-${crypto.randomBytes(6).toString("hex")}`;
            try {
              fs.writeFileSync(tempPath, updated, { encoding: "utf8", mode: 0o600, flag: "wx" });
              fs.chmodSync(tempPath, 0o600);
              fs.renameSync(tempPath, ".env");
              fs.chmodSync(".env", 0o600);
            } finally {
              if (fs.existsSync(tempPath)) fs.unlinkSync(tempPath);
            }
            NODE

            echo "Updated only the three Super Admin settings in VPS .env (values withheld)."
            pm2 reload ecosystem.config.cjs --env standalone --update-env >/dev/null 2>&1

            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/healthz >/dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              echo "ERROR: API health check failed after the credential-only reload."
              exit 1
            fi
            echo "API health check passed; Super Admin variables are present (values withheld)."
