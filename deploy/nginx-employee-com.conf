# Employee .com HTTPS routing is used only after Cloudflare public DNS and edge
# certificates cover both names, and the strict origin certificate below
# contains the exact admin host plus the nested employee wildcard.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name employee1088.isplatty.com *.employees.isplatty.com;

    ssl_certificate     /etc/ssl/cloudflare/isplatty-com-employee-origin/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare/isplatty-com-employee-origin/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
