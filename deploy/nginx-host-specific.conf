##############################################################
# OcholaSupernet — host-specific fallback nginx configuration
#
# Used only when the DNS provider cannot issue the preferred wildcard
# certificate. Tenant and VPN certificates are installed as exact-name
# snippets in /etc/nginx/tenant-sites.d.
##############################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name isplatty.org www.isplatty.org *.isplatty.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isplatty.org www.isplatty.org;

    ssl_certificate     /etc/letsencrypt/live/isplatty.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

include /etc/nginx/tenant-sites.d/*.conf;