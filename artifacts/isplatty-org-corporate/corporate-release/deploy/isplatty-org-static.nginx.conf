# Proposed STATIC-ONLY corporate routing.
# Review against the live Nginx tree before installing; do not overwrite BIL files.
# Replace the existing exact .org apex vhost only after the static files are staged.
# Do not add a wildcard .org vhost: existing tenant hosts stay with BIL.

server {
    listen 80;
    listen [::]:80;
    server_name isplatty.org www.isplatty.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/isplatty-org/acme;
    }
    location / {
        return 301 https://isplatty.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/isplatty-org/static-site;
    index index.html;
    location = /admin.html { return 404; }
    location ^~ /org-admin-api { return 404; }
    location ^~ /org-api { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    return 301 https://isplatty.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chrisphine3.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    return 404;
}
