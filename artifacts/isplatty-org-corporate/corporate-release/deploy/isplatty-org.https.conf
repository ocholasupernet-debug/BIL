# Exact-host corporate TLS routing. The existing shared port-80 vhost retains
# ACME and redirects; do not add another port-80 server here.
# Both hosts share ONLY the new corporate process. Node enforces host separation.
# Replace 8091 consistently ONLY if preflight proves it unavailable; never use 8080.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/isplatty-org-public-access.log;
    error_log /var/log/nginx/isplatty-org-public-error.log;
    client_max_body_size 7m;
    location ^~ /org-admin-api { return 404; }
    location ^~ /admin { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Replace untrusted client headers rather than append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    return 301 https://isplatty.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chrisphine3.isplatty.org;
    ssl_certificate /etc/letsencrypt/live/isplatty-org-corporate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isplatty-org-corporate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/isplatty-org-admin-access.log;
    error_log /var/log/nginx/isplatty-org-admin-error.log;
    client_max_body_size 7m;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
